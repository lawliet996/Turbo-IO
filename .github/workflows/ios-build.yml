name: Build Turbo IO iOS

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.0'

      - name: Show environment
        run: |
          xcodebuild -version
          swift --version
          node --version || true

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install XcodeGen
        run: |
          brew install xcodegen

      - name: Check repository
        run: |
          node scripts/start.mjs --device

      - name: Build iOS device target
        run: |
          xcodebuild \
            -project apps/RayNeoCompanion/RayNeoCompanion.xcodeproj \
            -scheme RayNeoCompanionDevice \
            -configuration Debug \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Package build
        run: |
          mkdir -p artifacts
          cp -R ~/Library/Developer/Xcode/DerivedData/RayNeoCompanion-*/Build/Products/Debug-iphoneos/RayNeoCompanion.app artifacts/ || true

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: turbo-io-ios-build
          path: artifacts
          if-no-files-found: warn
