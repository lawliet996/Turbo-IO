name: Build Turbo IO iOS device

on:
  workflow_dispatch:
  push:
    paths:
      - 'apps/RayNeoCompanion/**'
      - 'core-probe/**'
      - 'rayneo-*/**'
      - 'third-party/**'
      - '.github/workflows/ios-build.yml'
  pull_request:
    paths:
      - 'apps/RayNeoCompanion/**'
      - 'core-probe/**'
      - 'rayneo-*/**'
      - 'third-party/**'
      - '.github/workflows/ios-build.yml'

jobs:
  build-ios-device:
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate device Xcode project
        working-directory: apps/RayNeoCompanion
        run: xcodegen generate --spec project-device.yml

      - name: Resolve Swift packages
        run: |
          xcodebuild \
            -resolvePackageDependencies \
            -project apps/RayNeoCompanion/RayNeoCompanion.xcodeproj \
            -scheme RayNeoCompanionDevice

      - name: Archive iOS device target without signing
        shell: bash
        run: |
          set -o pipefail
          xcodebuild \
            -project apps/RayNeoCompanion/RayNeoCompanion.xcodeproj \
            -scheme RayNeoCompanionDevice \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/RayNeoCompanionDevice.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            archive 2>&1 | tee "$RUNNER_TEMP/rayneo-device-archive.log"
